[project]
name = "snailjob-mcp"
version = "0.1.0"
description = "MCP Server for managing SnailJob 1.8.x distributed task scheduling platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
snailjob-mcp = "snailjob_mcp.__main__:main"
snailjob-doctor = "snailjob_mcp.doctor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snailjob_mcp*"]
